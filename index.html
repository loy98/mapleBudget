<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>메이플 MVP작 효율 계산기</title>
  <meta name="description" content="메이플스토리 MVP 등급작(엠작) 최적 비용 계산기. 선물식·메소마켓·경매장 되팔기 비교, 마일리지, 거래 기록, 13주 달력, 등급 유지 스케줄까지." />
  <meta name="theme-color" content="#0a0b0e" />
  <!-- 테마 선반영(flash 방지). 기본 = 시스템(OS 설정) 추종. 저장값 'dark'/'light' 는 고정, 'system'/없음 은 OS 를 따른다. -->
  <script>try{var t=localStorage.getItem('mvpTheme');var d=t==='dark'||((!t||t==='system')&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);if(!d){document.documentElement.setAttribute('data-theme','light');var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content','#f4efe4');}}catch(e){}</script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="canonical" href="https://maplemvpcalculator.com/" />
  <!-- Open Graph (링크 공유 미리보기). og:image/og:url 은 절대 URL이어야 크롤러가 해석한다. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="메이플 MVP작 효율 계산기" />
  <meta property="og:title" content="메이플 MVP작 효율 계산기" />
  <meta property="og:description" content="엠작 최적화 · 계산기 + 거래 기록/13주 달력 · 등급 유지 스케줄" />
  <meta property="og:locale" content="ko_KR" />
  <meta property="og:url" content="https://maplemvpcalculator.com/" />
  <meta property="og:image" content="https://maplemvpcalculator.com/icon-512.png" />
  <meta name="twitter:card" content="summary" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
